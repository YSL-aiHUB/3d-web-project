<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiệm Bánh Mì (Giao diện mới)</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="game-container">
        <!-- Top bar: Ngày, Tiền, Đánh giá -->
        <header class="top-bar">
            <div class="top-left">
                <span class="day">Ngày 14</span>
                <span class="time">⏰ 11:00</span>
            </div>
            <div class="top-center">
                <div class="money">217,8k</div>
            </div>
            <div class="top-right">
                <span>⭐⭐⭐⭐⭐</span>
                <span class="rating">4.9 • 350 đánh giá</span>
            </div>
        </header>

        <!-- Khu vực Khách hàng & Order -->
        <div id="customer-area">
            <div class="customer-avatar">👨‍💼</div>
            <div class="bubble-order">
                <p id="order-text">Làm cho chú 1 ổ bánh mì đầy đủ, nhiều pate nha cháu!</p>
                <div class="patience-bar-container">
                    <span>KIÊN NHẪN</span>
                    <div class="patience-track">
                        <div id="patience-bar"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mái hiên sọc hồng -->
        <div class="awning"></div>

        <!-- Khu vực Quầy làm việc -->
        <div id="work-station">
            <!-- Tầng 1: Các loại sốt/pate (Tương đương quầy trà) -->
            <div class="shelf">
                <div class="ingredient-item">🥫<span>Pate</span></div>
                <div class="ingredient-item">🧈<span>Bơ</span></div>
                <div class="ingredient-item">🌶️<span>Tương ớt</span></div>
            </div>

            <!-- Tầng 2: Nguyên liệu chính (Tương đương khay topping) -->
            <div class="shelf grid-shelf">
                <!-- Khu vực lấy bánh -->
                <div class="board-area">
                    <div id="plate">Lấy bánh mì</div>
                </div>
                <!-- Khay topping -->
                <div class="topping-grid">
                    <div class="grid-item">🥩<span>Thịt chả</span></div>
                    <div class="grid-item">🍖<span>Thịt nướng</span></div>
                    <div class="grid-item">🍳<span>Trứng</span></div>
                    <div class="grid-item empty">Hết</div>
                    <div class="grid-item locked">🔒</div>
                    <div class="grid-item locked">🔒</div>
                </div>
            </div>

            <!-- Tầng 3: Rau củ (Tương đương đá/đường) -->
            <div class="shelf bottom-shelf">
                <div class="ingredient-item box">🥒<span>Dưa leo</span></div>
                <div class="ingredient-item box">🌿<span>Ngò rí</span></div>
                <div class="ingredient-item box">🥕<span>Đồ chua</span></div>
            </div>
        </div>

        <!-- Nút Giao hàng -->
        <div class="bottom-action">
            <button id="btn-serve">Giao cho khách</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
