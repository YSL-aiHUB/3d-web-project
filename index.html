<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xe Bánh Mì Vỉa Hè</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="game-container">
        <!-- Bảng thông tin -->
        <header class="top-bar">
            <h1>🥖 Bánh Mì Ghiền</h1>
            <div class="money">Tiền: <span id="money-display">0</span> VNĐ</div>
        </header>

        <!-- Khu vực Radio -->
        <div id="radio-station">
            <div class="radio-body">
                <span class="antenna">📻</span>
                <button id="btn-radio-toggle">Bật Nhạc</button>
            </div>
            <div id="radio-status">Đang tắt...</div>
            <!-- Thẻ audio ẩn, sử dụng link catbox -->
            <audio id="bg-radio" loop>
                <!-- Thay link .mp3 của bạn từ catbox.moe vào đây -->
                <source src="https://files.catbox.moe/uyh5ks.mp3" type="audio/mpeg">
            </audio>
        </div>

        <!-- Khu vực khách hàng -->
        <div id="customer-area">
            <div id="customer-order" class="hidden">
                💭 Cho 1 ổ: Bánh Mì + Pate + Thịt + Rau
            </div>
            <div id="customer-sprite">🧍‍♂️</div>
        </div>

        <!-- Khu vực tủ bánh (Bếp) -->
        <div id="kitchen-area">
            <div id="current-making">Đang làm: <span id="plate">Chưa có gì</span></div>
            <div class="ingredients">
                <button class="btn-item" data-item="Bánh Mì">🥖 Bánh Mì</button>
                <button class="btn-item" data-item="Pate">🥫 Phết Pate</button>
                <button class="btn-item" data-item="Thịt">🍖 Thêm Thịt</button>
                <button class="btn-item" data-item="Rau">🌿 Thêm Rau</button>
            </div>
            <button id="btn-serve" class="action-btn">🛒 Giao Cho Khách</button>
            <button id="btn-trash" class="action-btn trash">🗑️ Bỏ vào thùng rác</button>
        </div>
    </div>

    <!-- Nạp các file JS -->
    <script src="js/audio.js"></script>
    <script src="js/logic.js"></script>
</body>
</html>
