<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xe Bánh Mì Vỉa Hè</title>
    <!-- Gắn CSS theo đúng thứ tự -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="game-container">
        <!-- Bảng thông tin -->
        <header class="top-bar">
            <h1>🥖 Bánh Mì Ghiền</h1>
            <div class="money-box">Tiền: <span id="money-display">0</span> VNĐ</div>
        </header>

        <!-- Khu vực Radio -->
        <div id="radio-station">
            <div class="radio-body">
                <span class="antenna">📻</span>
                <button id="btn-radio-toggle">Bật Nhạc</button>
            </div>
            <div id="radio-status">Đang tắt...</div>
            <audio id="bg-radio" loop>
                <!-- Nhớ thay link nhạc lofi/bolero của bạn từ catbox vào đây -->
                <source src="https://files.catbox.moe/your-audio-file.mp3" type="audio/mpeg">
            </audio>
        </div>

        <!-- Cửa hàng nâng cấp (Shop) -->
        <div id="shop-area">
            <h3>🛒 Cửa Hàng</h3>
            <button class="btn-buy" id="btn-buy-fan" data-price="50000">Mua Quạt (50k) 🌬️</button>
            <button class="btn-buy" id="btn-buy-sign" data-price="100000">Bảng Hiệu LED (100k) 💡</button>
        </div>

        <!-- Khu vực khách hàng -->
        <div id="customer-area">
            <div id="customer-order" class="hidden">
                <p id="order-text">💭 Cho 1 ổ: Bánh Mì + Pate + Thịt + Rau</p>
                <!-- Thanh kiên nhẫn -->
                <div class="patience-bar-container">
                    <div id="patience-bar"></div>
                </div>
            </div>
            <!-- Khách hàng -->
            <div id="customer-sprite" class="hidden">🧍‍♂️</div>
        </div>

        <!-- Vùng hiển thị thông báo bay lên -->
        <div id="floating-text-container"></div>

        <!-- Khu vực tủ bánh (Bếp) -->
        <div id="kitchen-area">
            <div id="current-making">Đang làm: <span id="plate">Chưa có gì</span></div>
            <div class="ingredients">
                <button class="btn-item" data-item="Bánh Mì">🥖 Bánh Mì</button>
                <button class="btn-item" data-item="Pate">🥫 Phết Pate</button>
                <button class="btn-item" data-item="Thịt">🍖 Thêm Thịt</button>
                <button class="btn-item" data-item="Rau">🌿 Thêm Rau</button>
            </div>
            <button id="btn-serve" class="action-btn">🛒 Giao Cho Khách</button>
            <button id="btn-trash" class="action-btn trash">🗑️ Vứt đi</button>
        </div>
    </div>

    <!-- Gọi logic JS -->
    <script src="js/audio.js"></script>
    <script src="js/logic.js"></script>
</body>
</html>
